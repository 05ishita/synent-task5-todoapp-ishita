<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="A responsive To-Do List application with localStorage."
  />
  <title>TaskFlow | To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="app">
    <section class="todo-card">

      <div class="header">
        <div>
          <p class="eyebrow">TASK MANAGEMENT</p>
          <h1>TaskFlow</h1>
          <p class="subtitle">Organize your day, one task at a time.</p>
        </div>

        <div class="task-count">
          <span id="remainingCount">0</span>
          <small>remaining</small>
        </div>
      </div>

      <form id="todoForm" class="input-area">
        <input
          type="text"
          id="taskInput"
          placeholder="What needs to be done?"
          autocomplete="off"
          required
        />
        <button type="submit">Add Task</button>
      </form>

      <div class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="completed">Completed</button>
      </div>

      <ul id="taskList" class="task-list"></ul>

      <div id="emptyState" class="empty-state">
        <div class="empty-icon">✓</div>
        <h2>No tasks yet</h2>
        <p>Add your first task to get started.</p>
      </div>

      <div class="footer">
        <span id="totalCount">0 tasks</span>
        <button id="clearCompleted">Clear completed</button>
      </div>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
